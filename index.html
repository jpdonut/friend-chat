<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef1f5;
    }

    /* LOGIN */

    #loginScreen {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loginBox {
      background: white;
      width: 350px;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.15);
      text-align: center;
    }

    .loginBox h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    #error {
      color: red;
      margin-top: 10px;
    }

    /* CHAT */

    #chatScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      margin: 0;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 8px 15px;
      background: #1e40af;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      background: white;
      padding: 12px 15px;
      border-radius: 12px;
      margin-bottom: 10px;
      max-width: 70%;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }

    .message .name {
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 4px;
    }

    .messageBar {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
    }

    .messageBar input {
      margin: 0;
      flex: 1;
      margin-right: 10px;
    }

    .messageBar button {
      width: 100px;
      margin: 0;
    }
  </style>
</head>

<body>

  <!-- LOGIN SCREEN -->

  <div id="loginScreen">

    <div class="loginBox">

      <h1>My Chat</h1>

      <p>Log in to continue</p>

      <input
        id="username"
        type="text"
        placeholder="Username"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Log In
      </button>

      <div id="error"></div>

    </div>

  </div>


  <!-- CHAT SCREEN -->

  <div id="chatScreen">

    <div class="header">

      <h2>My Chat</h2>

      <button
        class="logout"
        onclick="logout()"
      >
        Log Out
      </button>

    </div>


    <div id="messages">

      <div class="message">

        <div class="name">
          Welcome
        </div>

        <div>
          Welcome to the chat!
        </div>

      </div>

    </div>


    <div class="messageBar">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>


  <script>

    /*
      TEMPORARY LOGIN

      This is only for testing the appearance.
      Do NOT use this method for a real private website.
    */

    const accounts = {
      "winn": "1234",
      "jr": "5678",
      "everett": "abcd",
      "griffin": "graham",
      "joseph": "dybas"
    };


    let currentUser = "";


    function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      if (accounts[username] === password) {

        currentUser = username;

        document.getElementById("loginScreen").style.display =
          "none";

        document.getElementById("chatScreen").style.display =
          "flex";

        error.innerText = "";

      } else {

        error.innerText =
          "Incorrect username or password.";

      }

    }


    function logout() {

      currentUser = "";

      document.getElementById("chatScreen").style.display =
        "none";

      document.getElementById("loginScreen").style.display =
        "flex";

      document.getElementById("username").value = "";

      document.getElementById("password").value = "";

    }


    function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (text === "") return;


      const message =
        document.createElement("div");

      message.className = "message";


      message.innerHTML = `

        <div class="name">
          ${currentUser}
        </div>

        <div>
          ${text}
        </div>

      `;


      document
        .getElementById("messages")
        .appendChild(message);


      input.value = "";

      document
        .getElementById("messages")
        .scrollTop =
        document.getElementById("messages").scrollHeight;

    }

  </script>

</body>
</html>
