<body>

  <div id="loginScreen">

    <div class="loginBox">

      <h1>My Chat</h1>

      <p>Log in to continue</p>

      <input
        id="username"
        type="text"
        placeholder="Username"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button onclick="login()">
        Log In
      </button>

      <div id="error"></div>

    </div>

  </div>


  <div id="chatScreen">

    <div class="header">

      <h2>My Chat</h2>

      <button class="logout" onclick="logout()">
        Log Out
      </button>

    </div>

    <div id="messages"></div>

    <div class="messageBar">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>


  <script>

    /* ================================
       SUPABASE CONNECTION
       ================================ */

    const SUPABASE_URL = "https://zawcmffaxdpzjghoyzuc.supabase.co";

    const SUPABASE_KEY = "sb_publishable_ZQWcdCuBXcfQxQMHY44BGg_oNDFCzW1";
    console.log("Supabase URL:", SUPABASE_URL);

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ================================
       TEMPORARY LOGIN
       ================================ */

    const accounts = {
      "winn": "1234",
      "jr": "5678",
      "everett": "abcd",
      "griffin": "graham",
      "joseph": "dybas"
    };

    let currentUser = "";


    /* ================================
       LOGIN
       ================================ */

    async function login() {

      const username =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value;

      const error =
        document.getElementById("error");


      if (accounts[username] === password) {

        currentUser = username;

        document.getElementById("loginScreen").style.display =
          "none";

        document.getElementById("chatScreen").style.display =
          "flex";

        error.innerText = "";

        await loadMessages();

      } else {

        error.innerText =
          "Incorrect username or password.";

      }

    }


    /* ================================
       LOG OUT
       ================================ */

    function logout() {

      currentUser = "";

      document.getElementById("chatScreen").style.display =
        "none";

      document.getElementById("loginScreen").style.display =
        "flex";

      document.getElementById("username").value = "";

      document.getElementById("password").value = "";

    }


    /* ================================
       LOAD MESSAGES
       ================================ */

    async function loadMessages() {

      const { data, error } =
        await supabaseClient
          .from("messages")
          .select("*")
          .order("created_at", { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      const messages =
        document.getElementById("messages");

      messages.innerHTML = "";

      data.forEach(message => {
        displayMessage(
          message.username,
          message.message
        );
      });

      messages.scrollTop = messages.scrollHeight;
    }


    /* ================================
       DISPLAY MESSAGE
       ================================ */

    function displayMessage(username, text) {

      const messages =
        document.getElementById("messages");

      const message =
        document.createElement("div");

      message.className = "message";

      const name =
        document.createElement("div");

      name.className = "name";

      name.textContent = username;

      const content =
        document.createElement("div");

      content.textContent = text;

      message.appendChild(name);
      message.appendChild(content);

      messages.appendChild(message);

      messages.scrollTop =
        messages.scrollHeight;
    }


    /* ================================
       SEND MESSAGE
       ================================ */

    async function sendMessage() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();

      if (text === "") return;


      const { error } =
        await supabaseClient
          .from("messages")
          .insert({
            username: currentUser,
            message: text
          });


      if (error) {

  console.error(error);

  alert("Supabase error: " + error.message);

  return;
}

      input.value = "";
    }


    /* ================================
       REALTIME CHAT
       ================================ */

    supabaseClient
      .channel("messages-channel")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        payload => {

          const message =
            payload.new;

          displayMessage(
            message.username,
            message.message
          );

        }
      )
      .subscribe();

  </script>

</body>
</html>
